# Pull request checks are shown as "<workflow name> / <job name>".
# Both use the same words so the check reads as Automatic tests pass.
name: Automatic tests pass

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    name: Automatic tests pass
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the vendored demo kit
        working-directory: ${{ github.workspace }}
        run: |
          sh vendor/demo-kit/check-hash.sh
          test "$(cat vendor/demo-kit/VERSION)" = "1"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check Python style
        id: style
        working-directory: ${{ github.workspace }}
        run: |
          ruff check
          ruff format --check

      - name: Run tests
        id: tests
        run: pytest

      - name: Write a plain-English summary
        if: success() || failure()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          STYLE_RESULT: ${{ steps.style.outcome }}
        run: |
          if [ "$TEST_RESULT" = "success" ] && [ "$STYLE_RESULT" = "success" ]; then
            result="These checks passed."
          else
            result="These checks did not pass."
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Automatic tests

          ${result} The tests check the visitor demo: the page loads, a sample receipt opens, spending questions match the receipts on screen, spreadsheet downloads match that list, and one visitor cannot see another visitor's upload. Ruff checks Python style and formatting.
          EOF
