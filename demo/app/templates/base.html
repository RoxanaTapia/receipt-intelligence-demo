<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Receipt Intelligence{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    {# Inlined: avoids /app ↔ static proxy mismatches on the portfolio edge. #}
    <style>{{ demo_css | safe }}</style>
  </head>
  <body>
    <main{% if scroll_target %} data-scroll="{{ scroll_target }}"{% endif %}>{% block content %}{% endblock %}</main>
  </body>
</html>
