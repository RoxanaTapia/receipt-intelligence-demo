<table>
  <thead>
    <tr>
      <th>Item</th>
      <th>Category</th>
      <th class="num">$</th>
    </tr>
  </thead>
  <tbody>
    {% for line in receipt.line_items %}
    <tr>
      <td>{{ line.description }}</td>
      <td><span class="cat-chip">{{ line.category }}</span></td>
      <td class="num">{{ money(line.price) }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
<div class="receipt-total">
  <span>Total</span>
  <span class="num">{{ money(receipt.total) }}</span>
</div>
