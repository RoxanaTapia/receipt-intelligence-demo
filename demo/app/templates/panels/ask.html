    <section class="step-card" id="ask-panel">
      <h2>Ask a question</h2>
      <form class="ask-form" id="ask-form" method="post" action="{{ public_url('/ask') }}">
        {% if selected %}
        <input type="hidden" name="example" value="{{ selected.id }}" />
        {% endif %}
        <input type="hidden" name="start" value="{{ window_start }}" />
        <input type="hidden" name="end" value="{{ window_end }}" />
        <label for="question">Your question</label>
        <textarea
          id="question"
          name="question"
          placeholder="How much did I spend per category?"
          required
        >{{ question }}</textarea>
        <div class="ask-chips" role="group" aria-label="Suggested questions">
          {% for item in suggested_questions %}
          <button
            type="button"
            class="ask-chip{% if question == item.question %} is-active{% endif %}"
            data-question="{{ item.question }}"
            {% if not api_ok and not live_panel %}disabled{% endif %}
          >{{ item.label }}</button>
          {% endfor %}
        </div>
        <div id="ask-answer">
          {% if qa_error %}
          <div class="banner err">{{ qa_error }}</div>
          {% endif %}
          {% if answer and answer.answer %}
          <div class="answer">
            <p>{{ answer.answer }}</p>
            {% if answer_source %}
            <p class="answer-source">{{ answer_source }}</p>
            {% endif %}
          </div>
          {% endif %}
        </div>
        <button type="submit" id="ask-btn" class="btn-secondary" {% if not api_ok and not live_panel %}disabled{% endif %}>
          <span class="btn-idle">Ask</span>
          <span class="btn-busy" hidden>Thinking…</span>
        </button>
        <p class="meta ask-wait" id="ask-wait" hidden>Thinking…</p>
      </form>
    </section>
