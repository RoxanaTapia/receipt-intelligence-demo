# Receipt Intelligence — local / VPS stack (n8n writer + API reader).
# From repo root:
#   cp .env.example .env   # set secrets
#   docker compose --env-file .env -f deploy/docker-compose.yml up --build -d
#
# Expects sibling clone at ../../receipt-intelligence-api (override with API_BUILD_CONTEXT).

services:
  api:
    build:
      context: ${API_BUILD_CONTEXT:-../../receipt-intelligence-api}
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      RECEIPT_DATA_PATH: /data/receipts
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ../data/receipts:/data/receipts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.27.4
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Berlin}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?Set N8N_BASIC_AUTH_PASSWORD in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Compose DNS — not host.docker.internal
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
    volumes:
      - n8n_data:/home/node/.n8n
      - ../data/receipts:/home/node/.n8n-files/receipts
    depends_on:
      api:
        condition: service_healthy

volumes:
  n8n_data:
