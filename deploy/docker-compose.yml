# Receipt Intelligence — local / VPS stack (n8n writer + API reader).
# From repo root:
#   cp .env.example .env   # set secrets
#   docker compose --env-file .env -f deploy/docker-compose.yml up --build -d
#
# Expects sibling clone at ../../receipt-intelligence-api (override with API_BUILD_CONTEXT).

services:
  api:
    build:
      context: ${API_BUILD_CONTEXT:-../../receipt-intelligence-api}
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      RECEIPT_DATA_PATH: /data/receipts
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ../data/receipts:/data/receipts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.27.4
    restart: unless-stopped
    ports:
      # Host publish port only — keep container listen port at 5678 (N8N_PORT below).
      - "${N8N_HOST_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      # Path prefix when n8n is behind Caddy at /n8n* (leave empty for local host publish).
      N8N_PATH: ${N8N_PATH:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:${N8N_HOST_PORT:-5678}/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Berlin}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?Set N8N_BASIC_AUTH_PASSWORD in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Compose DNS — not host.docker.internal
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
    volumes:
      - n8n_data:/home/node/.n8n
      - ../data/receipts:/home/node/.n8n-files/receipts
      # Allowlisted demo PDFs for webhook ingest (same bytes visitors download from UX).
      - ../demo/samples:/home/node/.n8n-files/samples:ro
    depends_on:
      api:
        condition: service_healthy

  # Thin visitor UX (FastAPI + templates). Seed data: ./deploy/seed-demo-data.sh
  ux:
    build:
      context: ../demo
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${UX_PORT:-8080}:8080"
    environment:
      API_BASE_URL: ${UX_API_BASE_URL:-http://api:8000}
      RECEIPT_DATA_PATH: /data/receipts
      SEED_DIR: /app/seed
      SAMPLES_DIR: /app/samples
      DEMO_START_DATE: ${DEMO_START_DATE:-2026-05-01}
      DEMO_END_DATE: ${DEMO_END_DATE:-2026-05-31}
      # Empty when Caddy (or ai-doc) strips /app via handle_path.
      ROOT_PATH: ${UX_ROOT_PATH:-}
      # Internal Compose DNS — not a public browser URL. Workflow must be Active.
      N8N_INGEST_WEBHOOK_URL: ${N8N_INGEST_WEBHOOK_URL:-http://n8n:5678/webhook/receipt-demo-ingest}
    volumes:
      - ../data/receipts:/data/receipts:ro
    depends_on:
      api:
        condition: service_healthy
      n8n:
        condition: service_started

volumes:
  n8n_data:
